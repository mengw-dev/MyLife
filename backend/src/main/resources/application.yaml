server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: MYLIFE_SESSION
        http-only: true
        path: /

spring:
  application:
    name: MyLife
  # 默认使用 dev，生产启动时用 --spring.profiles.active=prod 覆盖
  profiles:
    active: dev
  servlet:
    multipart:
      # 照片上传限制：单张最大 10MB（PRD 9 业务规则）
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

mylife:
  upload-dir: ./uploads
