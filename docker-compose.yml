services:
  mysql:
    image: mysql:8.4
    container_name: mylife-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: mylife
      TZ: Asia/Shanghai
    ports:
      # 本机已装 MySQL 时 3306 被占用，这里映射到 3307
      - "3307:3306"
    volumes:
      - mylife-mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mylife-mysql-data:
